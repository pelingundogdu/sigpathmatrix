[project]
name = "sigpathmatrix"
version = "1.0.0"
authors = [
  { name="Pelin Gundogdu"},
]
description = "The default prior biological knowledge using in sigPrimedNet network"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0-or-later"

# Define your dependency packages here
dependencies = [
    # "pandas>=2.3.3",
    # "PyYAML>=6.0.3",
    "python>=3.12.13",
    "r-base>=4.4.1",
    "rpy2>=3.6.6",                 # R interface for Python
    "r-reticulate>=1.46.0",        # R interface for Python (allows R to call Python)
    "r-logging>=0.10_111",         # Logging package for R
    "r-stringr>=1.6.0",            # String manipulation in R
    "r-argparse>=2.3.1",           # Command-line argument parsing for R
    "python-dotenv>=1.2.2",
    "bioconductor-hipathia>=3.6.0" # HiPathia package
]

[project.urls]
Homepage = "https://github.com/pelingundogdu/sigpathmatrix/"
Repository = "https://github.com/pelingundogdu/sigpathmatrix/"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"sigpathmatrix" = ["hipathia/*.R", "hipathia/*.r", "*.yml"]

[project.scripts]
MAIN_sigpathmatrix = 'sigpathmatrix.default_pbk_hipathia:main'
DEP_sigpathmatrix = 'sigpathmatrix.run_dependency:main'
